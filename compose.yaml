services:
  memorees:
    build: .
    image: memorees:0.2.0
    container_name: memorees
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - "${DATA_DIR:-./data}:/data"
    environment:
      ALLOW_SIGNUP: "${ALLOW_SIGNUP:-true}"   # set false in .env to lock registration
      BASE_URL: "${BASE_URL:-http://localhost:8000}"  # public address; used for share links
      BUILD_HASH: "${BUILD_HASH:-dev}"
      BUILD_DATE: "${BUILD_DATE:-unknown}"
    restart: unless-stopped
